<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services Brush</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark.css">
  <link rel="stylesheet" href="arabic.css">
  <link rel="stylesheet" href="projects-heading.css">
  <link rel="stylesheet" href="services-brush.css">
</head>
<body>
  <svg class="brush-defs" aria-hidden="true">
    <filter id="brush-rough" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".05 .3" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
  </svg>
  <div class="page">
    <main class="ph sv">
      <header class="ph-head" dir="rtl">
        <h1>ضربة فرشاة خلف الكلمة</h1>
        <p>الفرشاة ترسم نفسها مرة واحدة باتجاه القراءة. زر الإعادة يشغلها مرة ثانية.</p>
        <button class="ph-theme" id="sv-theme" type="button">تبديل الفاتح والداكن</button>
      </header>
      <div class="ph-list" id="options"></div>
    </main>
  </div>

  <script src="services-brush.js"></script>
</body>
</html>
