<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arabic Fonts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700&family=Readex+Pro:wght@500;700&family=Reem+Kufi:wght@500;700&family=Reem+Kufi+Fun:wght@500;700&family=Marhey:wght@500;700&family=Lemonada:wght@500;700&family=El+Messiri:wght@500;700&family=Kufam:wght@500;700&family=Changa:wght@500;700&family=Rakkas&family=Lalezar&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="arabic-fonts.css">
</head>
<body>
  <div class="page">
    <main class="af">
      <header class="af-head">
        <h1>خطوط مميزة للعناوين العربية</h1>
        <p>نفس العبارة ونفس تدرج اللون، وكلها خطوط مجانية. النص العادي يبقى بخط Thmanyah Sans.</p>
        <div class="af-reference" dir="ltr">
          <span class="line">Building the</span>
          <span class="line">systems behind</span>
          <span class="line">real products.</span>
        </div>
      </header>
      <div class="af-grid" id="fonts"></div>
    </main>
  </div>

  <script src="arabic-fonts.js"></script>
</body>
</html>
