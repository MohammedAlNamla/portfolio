<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Ideas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark.css">
  <link rel="stylesheet" href="arabic.css">
  <link rel="stylesheet" href="projects-heading.css">
  <link rel="stylesheet" href="contact-ideas.css">
</head>
<body>
  <svg class="brush-defs" aria-hidden="true">
    <filter id="brush-rough" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".05 .3" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
  </svg>
  <div class="page">
    <main class="ph">
      <header class="ph-head" dir="rtl">
        <h1>أفكار قسم التواصل بالإنجليزية</h1>
        <p>الأزرار هنا للعرض فقط. الفكرة أن تنتهي الصفحة بنفس لمسة بدايتها.</p>
        <button class="ph-theme" id="ct-theme" type="button">تبديل الفاتح والداكن</button>
      </header>
      <div class="ph-list" id="options"></div>
    </main>
  </div>

  <script src="contact-ideas.js"></script>
</body>
</html>
