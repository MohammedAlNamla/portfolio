<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experience Ideas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="experience.css">
  <link rel="stylesheet" href="dark.css">
  <link rel="stylesheet" href="arabic.css">
  <link rel="stylesheet" href="projects-heading.css">
  <link rel="stylesheet" href="experience-ideas.css">
</head>
<body>
  <svg class="brush-defs" aria-hidden="true">
    <filter id="brush-rough" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".05 .3" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </svg>
  <div class="page">
    <main class="ph">
      <header class="ph-head" dir="rtl">
        <h1>أفكار قسم الخبرات</h1>
        <p>كل فكرة لمسة واحدة فوق القسم الحالي. الخيارات التي تعتمد على الماوس مكتوب عليها ذلك.</p>
        <button class="ph-theme" id="xd-theme" type="button">تبديل الفاتح والداكن</button>
      </header>
      <div class="ph-list" id="options"></div>
    </main>
  </div>

  <script src="experience-ideas.js"></script>
</body>
</html>
