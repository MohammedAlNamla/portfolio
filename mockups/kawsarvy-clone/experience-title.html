<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experience Titles</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark.css">
  <link rel="stylesheet" href="arabic.css">
  <link rel="stylesheet" href="projects-heading.css">
  <link rel="stylesheet" href="experience-title.css">
</head>
<body>
  <svg class="brush-defs" aria-hidden="true">
    <filter id="brush-rough" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".05 .3" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
  </svg>
  <div class="page">
    <main class="ph">
      <header class="ph-head">
        <h1>عنوان قسم الخبرات</h1>
        <p>صياغات مختلفة، وكل واحدة بمعالجة خط تناسبها. يمكن أخذ الجملة من خيار والخط من خيار آخر.</p>
        <button class="ph-theme" id="xt-theme" type="button">تبديل الفاتح والداكن</button>
      </header>
      <div class="ph-list" id="options"></div>
    </main>
  </div>

  <script src="experience-title.js"></script>
</body>
</html>
